# Intégration continue : chaque modification est vérifiée (tests API, typage, lint, build).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fajma
          POSTGRES_PASSWORD: fajma
          POSTGRES_DB: fajma
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U fajma" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Aucune modification de la base oubliée (migration manquante)
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (SQLite)
        run: python manage.py test
      - name: Tests (PostgreSQL, comme en production)
        run: python manage.py test
        env:
          DATABASE_URL: postgres://fajma:fajma@localhost:5432/fajma
      - name: Vérifications de sécurité Django
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-secret-0123456789abcdefghij
          FILE_ENCRYPTION_KEYS: Y2ktb25seS1ub3QtYS1yZWFsLWtleS0wMTIzNDU2Nzg=
      - name: Failles connues dans les bibliothèques Python
        run: pip install pip-audit && pip-audit -r requirements.txt --strict
      - name: Analyse statique de sécurité du code (bandit)
        # B310 (urlopen) écarté : toutes les adresses appelées viennent de la configuration, jamais d'un
        # utilisateur, et « require_https » dans settings.py refuse désormais autre chose que https.
        run: pip install bandit && bandit -q -r . -x ./tests,./staticfiles --severity-level medium --skip B310

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

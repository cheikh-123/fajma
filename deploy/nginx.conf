# Fajma — serveur web : fichiers du site + relais vers l'API Django.
# TLS : à terminer ici (certificats Let's Encrypt montés dans /etc/nginx/certs) ou sur un répartiteur en amont.

server_tokens off;
client_max_body_size 12m;

# Protocole d'origine : celui annoncé par un répartiteur TLS en amont, sinon celui de cette connexion.
map $http_x_forwarded_proto $fajma_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Robots d'indexation et d'aperçu de liens : ils reçoivent une page HTML simple générée par Django.
map $http_user_agent $is_seo_bot {
    default 0;
    ~*(googlebot|bingbot|yandex|duckduckbot|baiduspider|applebot|facebookexternalhit|facebot|twitterbot|linkedinbot|whatsapp|telegrambot|slackbot|discordbot) 1;
}

upstream fajma_events {
    server events:8001;
}

upstream fajma_api {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    include /etc/nginx/conf.d/csp.inc;
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ── Temps réel : flux d'événements, envoyé sans mise en mémoire tampon, connexion longue ──
    location = /api/events {
        proxy_pass http://fajma_events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fajma_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
    }

    # ── API, administration Django et ses fichiers statiques ─────────
    location ~ ^/(api|django-admin|static)/|^/(robots\.txt|sitemap\.xml)$ {
        proxy_pass http://fajma_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fajma_proto;
        proxy_read_timeout 60s;
        # Django envoie déjà ces en-têtes : on garde uniquement ceux de nginx (pas de doublons).
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Cross-Origin-Opener-Policy;
    }

    # ── Fichiers versionnés : mis en cache longtemps ─────────────────
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ── Fiches médecin et spécialités : version HTML pour les robots, application pour les visiteurs ──
    location ~ ^/(medecins/[0-9a-f-]{36}|specialites/[a-z0-9-]+)$ {
        if ($is_seo_bot) {
            rewrite ^ /seo$uri break;
            proxy_pass http://fajma_api;
        }
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        add_header Vary "User-Agent";
        try_files /_shell.html =404;
    }

    # ── Module de réservation intégrable (iframe sur le site d'un médecin) : seule page affichable dans un cadre ──
    location ~ ^/widget/[0-9a-f-]{36}$ {
        include /etc/nginx/snippets/embed-headers.conf;
        add_header Cache-Control "no-cache";
        try_files /_shell.html =404;
    }

    # ── Application (SPA) : toute autre adresse sert la page d'accueil de l'application ──
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /_shell.html;
    }
}

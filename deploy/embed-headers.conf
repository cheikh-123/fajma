# En-têtes du module de réservation intégrable (/widget/<id>) : mêmes protections que le reste du site,
# sauf l'interdiction d'affichage dans un cadre. Le module ne contient ni connexion ni paiement
# (la réservation se termine sur Fajma dans un nouvel onglet), donc pas de risque de détournement de clic.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' $csp_script_hashes; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors *; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# En-têtes de sécurité, inclus dans chaque bloc « location » qui ajoute ses propres en-têtes :
# nginx n'hérite pas des add_header du serveur dès qu'un bloc en déclare un.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(self \"$jitsi_origin\"), microphone=(self \"$jitsi_origin\"), geolocation=(self)" always;
# Scripts : uniquement nos fichiers + les scripts intégrés dont l'empreinte est connue (csp.inc).
# $jitsi_origin : serveur de visioconférence choisi au build (VITE_JITSI_DOMAIN).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' $csp_script_hashes; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self'; frame-src $jitsi_origin; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
